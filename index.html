<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Habitnja - Aplikasi Habit Tracker modern dengan soft blue theme. Lacak kebiasaan harian, streak, dan progress kamu." />
  <meta name="theme-color" content="#7BA3C9" />
  <title>Habitnja — Habit Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon">✦</div>
        <h1>Habitnja</h1>
      </div>
      <div class="header-actions">
        <input type="file" id="importInput" accept=".json" hidden />
        <button id="importBtn" class="icon-btn" title="Import data">⬆</button>
        <button id="exportBtn" class="icon-btn" title="Export data">⬇</button>
        <button id="themeToggle" class="icon-btn" title="Ganti tema">
          <span class="sun">☀</span>
          <span class="moon">☾</span>
        </button>
        <button id="addHabitBtn" class="btn-primary">+ Tambah Habit</button>
      </div>
    </header>

    <!-- Stats Overview -->
    <section class="stats" id="stats">
      <div class="stat-card">
        <div class="stat-value" id="statTotal">0</div>
        <div class="stat-label">Total Habit</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statCompleted">0</div>
        <div class="stat-label">Selesai Hari Ini</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statStreak">0</div>
        <div class="stat-label">Streak Terbaik</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statRate">0%</div>
        <div class="stat-label">Completion Rate</div>
      </div>
    </section>

    <!-- Calendar Section -->
    <section class="calendar-section">
      <div class="calendar-header">
        <button id="prevMonth" class="icon-btn small">‹</button>
        <h3 id="calendarTitle">Bulan</h3>
        <button id="nextMonth" class="icon-btn small">›</button>
      </div>
      <div class="calendar-weekdays">
        <span>Min</span><span>Sen</span><span>Sel</span><span>Rab</span><span>Kam</span><span>Jum</span><span>Sab</span>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
      <div class="calendar-legend">
        <span><i class="dot none"></i> Tidak ada</span>
        <span><i class="dot low"></i> Sebagian</span>
        <span><i class="dot high"></i> Hampir / Semua</span>
      </div>
    </section>

    <!-- Habit List -->
    <main class="main">
      <div class="section-header">
        <h2>Habit Hari Ini</h2>
        <span class="date" id="todayDate"></span>
      </div>

      <!-- Filter -->
      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">Semua</button>
        <button class="filter-btn" data-filter="pending">Belum</button>
        <button class="filter-btn" data-filter="done">Selesai</button>
      </div>

      <div id="habitList" class="habit-list"></div>

      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">🌱</div>
        <h3>Belum ada habit</h3>
        <p>Mulai bangun kebiasaan baik dengan menambahkan habit pertama kamu.</p>
        <button class="btn-primary" onclick="document.getElementById('addHabitBtn').click()">
          + Tambah Habit Pertama
        </button>
      </div>
    </main>

    <footer class="footer">
      <p>Habitnja • Dibuat dengan 💙</p>
    </footer>
  </div>

  <!-- Modal Tambah / Edit Habit -->
  <div id="modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Tambah Habit Baru</h3>
        <button class="close-btn" id="closeModal">×</button>
      </div>
      <form id="habitForm">
        <div class="form-group">
          <label for="habitName">Nama Habit</label>
          <input type="text" id="habitName" placeholder="Contoh: Baca buku 20 menit" required maxlength="60" />
        </div>
        <div class="form-group">
          <label for="habitColor">Warna</label>
          <div class="color-picker" id="colorPicker">
            <button type="button" class="color-option active" data-color="#7BA3C9" style="background:#7BA3C9"></button>
            <button type="button" class="color-option" data-color="#7DC4B2" style="background:#7DC4B2"></button>
            <button type="button" class="color-option" data-color="#C5B8E0" style="background:#C5B8E0"></button>
            <button type="button" class="color-option" data-color="#E8A87C" style="background:#E8A87C"></button>
            <button type="button" class="color-option" data-color="#E07A7A" style="background:#E07A7A"></button>
            <button type="button" class="color-option" data-color="#6B9AC4" style="background:#6B9AC4"></button>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-secondary" id="cancelBtn">Batal</button>
          <button type="submit" class="btn-primary" id="saveBtn">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
